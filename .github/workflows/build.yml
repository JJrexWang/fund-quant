name: build-image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=ghcr.io/jjrexwang/fund-quant:latest,ghcr.io/jjrexwang/fund-quant:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/jjrexwang/fund-quant:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64
